<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Adventure Island Listen &amp; Choose!</title>
    <style>
      :root {
        --sand: #f6e3b4;
        --sand-dark: #e8c988;
        --ocean-deep: #0e6e6e;
        --ocean: #8b1a2b; /* dark red */
        --ocean-light: #d6303f; /* bright red */
        --coral: #ff7b54;
        --sun: #ffd23f;
        --ink: #0b3d3a;
        --white: #fffdf8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100dvh;
        overflow: hidden;
        background: radial-gradient(ellipse at center top, #e85a1a, #c03a0a);
        font-family: "Trebuchet MS", "Verdana", sans-serif;
        color: var(--ink);
      }

      /* decorative */
      .sun {
        position: absolute;
        top: max(10px, env(safe-area-inset-top, 10px));
        right: clamp(10px, 4vw, 40px);
        width: clamp(40px, 8vw, 72px);
        height: clamp(40px, 8vw, 72px);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffefae, var(--sun) 70%);
        box-shadow: 0 0 24px 8px rgba(255, 210, 63, 0.5);
        pointer-events: none;
        z-index: 0;
      }
      .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.82);
        border-radius: 50px;
        pointer-events: none;
        z-index: 0;
      }
      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: 50%;
      }
      .cloud1 {
        top: 5%;
        left: 5%;
        width: 80px;
        height: 26px;
      }
      .cloud1::before {
        width: 40px;
        height: 40px;
        top: -18px;
        left: 8px;
      }
      .cloud1::after {
        width: 30px;
        height: 30px;
        top: -12px;
        left: 42px;
      }
      /* layout */
      .wrap {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        height: 100dvh;
        padding: max(6px, env(safe-area-inset-top, 6px))
          max(10px, env(safe-area-inset-right, 10px))
          max(8px, env(safe-area-inset-bottom, 8px))
          max(10px, env(safe-area-inset-left, 10px));
        gap: 0;
        overflow: visible;
      }

      /* header row */
      .header {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-shrink: 0;
        padding: 4px 0 6px;
        gap: clamp(6px, 2vw, 14px);
        flex-wrap: wrap;
      }

      .header-left {
        display: flex;
        align-items: center;
        gap: clamp(6px, 2vw, 14px);
        flex-wrap: wrap;
        min-width: 0;
      }

      .header-right {
        display: flex;
        align-items: center;
        min-width: 0;
      }

      h1 {
        font-family: "Chalkboard SE", "Comic Sans MS", cursive, sans-serif;
        font-size: clamp(16px, 5.5vw, 50px);
        color: var(--sun);
        -webkit-text-stroke: 1px #4a0e14;
        white-space: nowrap;
      }

      .pill {
        background: var(--white);
        border: 2.5px solid var(--ocean);
        border-radius: 999px;
        padding: 3px 9px;
        font-weight: bold;
        font-size: clamp(10px, 2vw, 14px);
        white-space: nowrap;
        color: var(--ocean-deep);
      }

      .reset-btn {
        background: var(--coral);
        color: var(--white);
        border: none;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: clamp(10px, 2vw, 14px);
        white-space: nowrap;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 3px 0 #c2522f;
        font-family: inherit;
        flex-shrink: 0;
        text-decoration: none;
      }
      .reset-btn:active {
        transform: translateY(2px);
        box-shadow: none;
      }

      .toggle-pill {
        background: var(--coral);
        color: var(--white);
        border: none;
        border-radius: 999px;
        padding: 4px 12px;
        font-size: clamp(10px, 2vw, 14px);
        white-space: nowrap;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 3px 0 #c2522f;
        font-family: inherit;
        flex-shrink: 0;
        transition:
          transform 0.1s,
          background 0.15s,
          color 0.15s,
          box-shadow 0.15s;
      }
      .toggle-pill:active {
        transform: translateY(2px);
        box-shadow: none;
      }
      .toggle-pill.off {
        background: #eaeaea;
        color: #8a8a8a;
        box-shadow: 0 3px 0 #b5b5b5;
      }

      /* main play area */
      .stage {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(10px, 2.5vh, 24px);
        min-height: 0;
      }

      /* big voice/play button */
      .voice-btn {
        font-family: "Chalkboard SE", "Comic Sans MS", cursive, sans-serif;
        font-weight: bold;
        font-size: clamp(20px, 6vw, 42px);
        color: var(--white);
        background: repeating-linear-gradient(
          135deg,
          var(--ocean) 0px,
          var(--ocean) 10px,
          var(--ocean-light) 10px,
          var(--ocean-light) 20px
        );
        border: 3px solid var(--sun);
        border-radius: 999px;
        padding: clamp(14px, 3vh, 24px) clamp(28px, 8vw, 60px);
        cursor: pointer;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.2);
        -webkit-text-stroke: 1px #4a0e14;
        transition: transform 0.1s;
        flex-shrink: 0;
      }
      .voice-btn:active {
        transform: translateY(4px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.2);
      }
      .voice-btn.pulse {
        animation: pulse 0.6s ease-in-out;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.06);
        }
      }

      /* answer buttons */
      .answers {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: clamp(10px, 3vw, 24px);
        width: 100%;
        max-width: 700px;
        min-height: 0;
      }

      .answer-btn {
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
        border-radius: clamp(14px, 3vw, 26px);
        border: 3px solid var(--sun);
        background: var(--white);
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.12);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8%;
        transition: transform 0.1s;
      }
      .answer-btn:active {
        transform: translateY(3px);
      }
      .answer-btn img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        pointer-events: none;
      }

      .answer-btn.correct {
        border-color: var(--sun);
        background: linear-gradient(135deg, #fffbea, #fff1c4);
        animation: glow 1s ease-in-out infinite alternate;
      }
      @keyframes glow {
        from {
          box-shadow:
            0 0 6px 0 rgba(255, 210, 63, 0.6),
            0 5px 0 rgba(0, 0, 0, 0.12);
        }
        to {
          box-shadow:
            0 0 16px 6px rgba(255, 210, 63, 0.85),
            0 5px 0 rgba(0, 0, 0, 0.12);
        }
      }
      .answer-btn.wrong {
        animation: shake 0.4s;
        border-color: var(--ocean-light);
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-8px);
        }
        75% {
          transform: translateX(8px);
        }
      }
      .answer-btn.disabled {
        pointer-events: none;
        opacity: 0.6;
      }

      .sparkle {
        position: absolute;
        font-size: 16px;
        pointer-events: none;
        animation: pop 0.9s ease-out forwards;
        z-index: 5;
      }
      @keyframes pop {
        0% {
          opacity: 1;
          transform: translate(0, 0) scale(0.6) rotate(0deg);
        }
        100% {
          opacity: 0;
          transform: translate(var(--dx), var(--dy)) scale(1.3) rotate(180deg);
        }
      }

      .rotate-msg {
        display: none;
        position: fixed;
        inset: 0;
        background: linear-gradient(180deg, #f4b23e 0%, #e47d31 60%);
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 16px;
        z-index: 100;
      }

      .rotate-msg p {
        font-family: "Chalkboard SE", "Comic Sans MS", cursive;
        font-size: clamp(18px, 4vw, 28px);
        color: var(--white);
        -webkit-text-stroke: 1px var(--ocean-deep);
        text-align: center;
        padding: 0 20px;
      }

      @media (orientation: landscape) and (max-width: 926px) {
        .wrap,
        .overlay {
          display: none;
        }
        .rotate-msg {
          display: flex;
        }
      }
      @media (orientation: portrait) and (max-width: 926px) {
        .sun,
        .cloud {
          display: none;
        }
      }

      @media (orientation: portrait) {
        .rotate-msg {
          display: none;
        }

        .answers {
          grid-template-columns: 1fr;
          grid-template-rows: 1fr 1fr;
        }
      }

      /* win overlay */
      .overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(11, 61, 58, 0.72);
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 20px;
      }
      .overlay.show {
        display: flex;
      }
      .win-card {
        background: var(--white);
        border-radius: 24px;
        padding: clamp(20px, 5vw, 36px);
        text-align: center;
        max-width: 360px;
        width: 100%;
        box-shadow: 0 10px 0 rgba(0, 0, 0, 0.15);
        border: 4px solid var(--sun);
      }
      .win-card h2 {
        font-family: "Chalkboard SE", "Comic Sans MS", cursive;
        color: var(--coral);
        -webkit-text-stroke: 1px var(--ocean-deep);
        font-size: clamp(22px, 5.5vw, 30px);
        margin: 0 0 8px;
      }
      .win-card p {
        font-weight: bold;
        color: var(--ocean-deep);
        margin-bottom: 16px;
      }
      .win-emojis {
        font-size: 32px;
        margin-bottom: 8px;
      }
    </style>
  </head>
  <body>
    <div class="rotate-msg">
      <p>🔄 Please rotate your device to portrait mode!</p>
    </div>
    <div class="wrap">
      <div class="sun"></div>
      <div class="cloud cloud1"></div>

      <div class="header">
        <div class="header-left">
          <a class="reset-btn" href="index.html">⬅️ Back</a>
          <button class="toggle-pill" id="voiceToggle" aria-pressed="true">
            🔊 Voice
          </button>
        </div>
        <h1>Unit 19</h1>
        <div class="header-right">
          <span class="pill" id="progressPill">1 / 12</span>
        </div>
      </div>

      <div class="stage">
        <button class="voice-btn" id="playWordBtn">🔊 Listen</button>
        <div class="answers" id="answers"></div>
      </div>
    </div>

    <div class="overlay" id="overlay">
      <div class="win-card">
        <div class="win-emojis">📕 Great! 📕</div>
        <h2>You finished all the questions!</h2>
        <p id="winStats">Adventure Island</p>
        <button class="reset-btn" id="playAgainBtn">Play Again 🌴</button>
      </div>
    </div>

    <script>
      /* ---- word bank — same images/words as Match-Up ---- */

      const WORDS = [
        // Unit 19
        { word: "Santa", img: "../images/santa.png" },
        { word: "reindeer", img: "../images/reindeer.png" },
        { word: "star", img: "../images/star.png" },
        { word: "tree", img: "../images/tree19.png" },
        { word: "present", img: "../images/present.png" },
        { word: "snowman", img: "../images/snowman.png" },
      ];

      /* ---- audio (matching sounds) ---- */
      let audioCtx = null;
      function getCtx() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function playTone(freq, startTime, duration, gainPeak) {
        const ctx = getCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "triangle";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        gain.gain.setValueAtTime(0, startTime);
        gain.gain.linearRampToValueAtTime(gainPeak, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }
      function playMatchJingle() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((f, i) =>
          playTone(f, now + i * 0.09, 0.22, 0.22),
        );
      }
      function playWrongSound() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        playTone(220, now, 0.18, 0.12);
        playTone(196, now + 0.08, 0.18, 0.1);
      }
      function playWinFanfare() {
        const ctx = getCtx(),
          now = ctx.currentTime;
        [523.25, 523.25, 659.25, 783.99, 1046.5, 1318.51].forEach((f, i) =>
          playTone(f, now + [0, 0.15, 0.3, 0.45, 0.6, 0.8][i], 0.3, 0.22),
        );
      }

      /* ---- text-to-speech ---- */
      function speakWord(text) {
        if (!voiceOn) return;
        if (!("speechSynthesis" in window)) return;
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = "en-US";
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      }

      /* ---- game state ---- */
      let questions = [],
        qIndex = 0,
        locked = false,
        voiceOn = true;

      function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }

      function buildQuestions() {
        // each of the 6 words used twice = 12 questions
        let list = [...WORDS, ...WORDS];
        shuffle(list);
        return list.map((target) => {
          // pick a distractor that isn't the target word
          let distractor;
          do {
            distractor = WORDS[Math.floor(Math.random() * WORDS.length)];
          } while (distractor.word === target.word);

          const options = shuffle([target, distractor]);
          return { target, options };
        });
      }

      function renderQuestion() {
        const q = questions[qIndex];
        document.getElementById("progressPill").textContent =
          `${qIndex + 1} / ${questions.length}`;

        const answersEl = document.getElementById("answers");
        answersEl.innerHTML = "";

        q.options.forEach((opt) => {
          const btn = document.createElement("button");
          btn.className = "answer-btn";
          btn.dataset.word = opt.word;

          const img = document.createElement("img");
          img.src = opt.img;
          img.alt = opt.word;
          btn.appendChild(img);

          btn.addEventListener("click", () => onAnswerClick(btn, opt, q));
          answersEl.appendChild(btn);
        });

        locked = false;
        // automatically say the word when the question loads
        speakWord(q.target.word);
      }

      function onAnswerClick(btn, opt, q) {
        getCtx();
        if (locked) return;

        if (opt.word === q.target.word) {
          locked = true;
          btn.classList.add("correct");
          spawnSparkles(btn);
          playMatchJingle();
          document
            .querySelectorAll(".answer-btn")
            .forEach((b) => b.classList.add("disabled"));

          setTimeout(() => {
            qIndex++;
            if (qIndex >= questions.length) {
              showWin();
            } else {
              renderQuestion();
            }
          }, 800);
        } else {
          btn.classList.add("wrong");
          playWrongSound();
          setTimeout(() => btn.classList.remove("wrong"), 400);
        }
      }

      function spawnSparkles(el) {
        const emojis = ["✨", "🌟", "🐚", "⭐"];
        for (let i = 0; i < 6; i++) {
          const s = document.createElement("div");
          s.className = "sparkle";
          s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
          const angle = Math.random() * Math.PI * 2;
          const dist = 40 + Math.random() * 30;
          s.style.setProperty("--dx", `${Math.cos(angle) * dist}px`);
          s.style.setProperty("--dy", `${Math.sin(angle) * dist}px`);
          s.style.left = "50%";
          s.style.top = "50%";
          el.appendChild(s);
          setTimeout(() => s.remove(), 950);
        }
      }

      function showWin() {
        document.getElementById("winStats").textContent =
          `You answered all ${questions.length} questions!`;
        document.getElementById("overlay").classList.add("show");
        playWinFanfare();
      }

      function newGame() {
        qIndex = 0;
        locked = false;
        questions = buildQuestions();
        document.getElementById("overlay").classList.remove("show");
        renderQuestion();
      }

      /* ---- manual replay of the word ---- */
      const playWordBtn = document.getElementById("playWordBtn");
      playWordBtn.addEventListener("click", () => {
        getCtx();
        playWordBtn.classList.remove("pulse");
        void playWordBtn.offsetWidth; // restart animation
        playWordBtn.classList.add("pulse");
        speakWord(questions[qIndex].target.word);
      });

      /* ---- sound toggle ---- */
      const voiceToggleBtn = document.getElementById("voiceToggle");
      voiceToggleBtn.addEventListener("click", () => {
        voiceOn = !voiceOn;
        voiceToggleBtn.textContent = voiceOn ? "🔊 Voice" : "🔇 Voice";
        voiceToggleBtn.classList.toggle("off", !voiceOn);
        voiceToggleBtn.setAttribute("aria-pressed", String(voiceOn));
        if (!voiceOn && "speechSynthesis" in window) {
          window.speechSynthesis.cancel();
        }
      });

      document
        .getElementById("playAgainBtn")
        .addEventListener("click", newGame);

      newGame();
    </script>
  </body>
</html>
