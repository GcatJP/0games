<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />
    <meta name="theme-color" content="#c8441a" />

    <!-- App icon -->
    <link rel="apple-touch-icon" href="../images/home0.png" />

    <link rel="manifest" href="manifest.json" />

    <title>Adventure Island FS</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --font-chalk:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        --sun: #ffd23f;
        --orange-dark: #c45a1a;
        --btn-face: #8b2a00;
        --btn-border: #e8a020;
        --btn-text: #e8a020;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      /* Solid red fallback so no white ever shows (overscroll, home bar area) */
      html {
        width: 100%;
        height: 100%;
        background-color: #bf3f12;
        overflow: hidden;
      }

      body {
        font-family: var(--font-chalk);
        width: 100%;
        height: 100vh;
        height: 100%;
        overflow: hidden;
        position: relative;
        background: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Full-screen background layer (covers safe areas too) */
      .bg {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse at center top, #e85a1a, #c03a0a);
        z-index: -1;
        overflow: hidden;
        pointer-events: none;
      }

      /* decorative sun & cloud */
      .sun {
        position: absolute;
        top: calc(var(--safe-top) + 10px);
        right: clamp(10px, 4vw, 40px);
        width: clamp(40px, 8vw, 72px);
        height: clamp(40px, 8vw, 72px);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffefae, var(--sun) 70%);
        box-shadow: 0 0 24px 8px rgba(255, 210, 63, 0.5);
      }
      .cloud {
        position: absolute;
        background: rgba(255, 255, 255, 0.82);
        border-radius: 50px;
      }
      .cloud::before,
      .cloud::after {
        content: "";
        position: absolute;
        background: inherit;
        border-radius: 50%;
      }
      .cloud1 {
        top: calc(var(--safe-top) + 30px);
        left: 5%;
        width: 80px;
        height: 26px;
      }
      .cloud1::before {
        width: 40px;
        height: 40px;
        top: -18px;
        left: 8px;
      }
      .cloud1::after {
        width: 30px;
        height: 30px;
        top: -12px;
        left: 42px;
      }

      /* ---------- LAYOUT: header / main / footer ---------- */
      header {
        flex: 0 0 auto;
        width: 100%;
        padding: calc(var(--safe-top) + 3vh) 5vw 0;
        text-align: center;
      }

      h1 {
        font-family: var(--font-chalk);
        color: #fae207;
        -webkit-text-stroke: 1.5px #f4930b;
        letter-spacing: 0.03em;
        line-height: 1.05;
        font-size: clamp(1.6rem, min(11vw, 6.5vh), 4rem);
      }

      main {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 3vh 9vw;
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        grid-template-rows: repeat(3, minmax(0, 1fr));
        gap: clamp(12px, 3vh, 28px);
        width: 100%;
        max-width: 520px;
        height: 100%;
        max-height: 680px;
      }

      footer {
        flex: 0 0 auto;
        width: 100%;
        text-align: center;
        padding: 0 4vw calc(var(--safe-bottom) + 2.5vh);
      }

      .credit {
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(0.95rem, 4vw, 1.5rem);
        color: #ffffff;
        -webkit-text-stroke: 3px darkred;
        paint-order: stroke fill;
        letter-spacing: 0.02em;
        pointer-events: none;
      }

      /* ---------- BUTTONS ---------- */
      .btn {
        font-family: var(--font-chalk);
        font-weight: bold;
        font-size: clamp(1.3rem, min(9vw, 5vh), 3rem);
        color: var(--btn-text);
        background: var(--btn-face);
        border: 3px solid var(--btn-border);
        border-radius: clamp(10px, 2vw, 18px);
        text-decoration: none;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.15em;
        padding: 0.3em 0.6em;
        width: 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.2);
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease;
      }

      .btn:active {
        transform: translateY(3px) scale(0.98);
        box-shadow: 0 1px 0 var(--orange-dark);
      }

      .btn-text {
        flex: 0 0 auto;
        text-align: center;
        line-height: 1.05;
      }

      .btn-icon {
        flex: 1 1 0;
        min-height: 0;
        max-width: 100%;
        width: auto;
        object-fit: contain;
        pointer-events: none;
        -webkit-user-select: none;
        user-select: none;
      }

      /* ---------- LANDSCAPE ---------- */
      @media screen and (orientation: landscape) {
        header {
          padding-top: calc(var(--safe-top) + 2vh);
        }

        h1 {
          font-size: clamp(1.4rem, min(7vw, 11vh), 4.5rem);
        }

        main {
          padding: 2vh 4vw;
        }

        .grid {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          grid-template-rows: minmax(0, 1fr);
          gap: clamp(8px, 1.6vw, 20px);
          max-width: 1300px;
          max-height: 420px;
        }

        .btn {
          font-size: clamp(1rem, min(4vw, 8vh), 2.8rem);
        }

        footer {
          padding-bottom: calc(var(--safe-bottom) + 1.5vh);
        }

        .credit {
          font-size: clamp(0.8rem, 2.6vh, 1.4rem);
          -webkit-text-stroke: 2.5px darkred;
        }
      }
    </style>
  </head>

  <body>
    <div class="bg">
      <div class="sun"></div>
      <div class="cloud cloud1"></div>
    </div>

    <header>
      <h1>Adventure Island</h1>
    </header>

    <main>
      <div class="grid" id="main-grid">
        <a class="btn" href="videos.html">
          <span class="btn-text">Videos</span>
          <img class="btn-icon" src="images/sv.png" alt="" />
        </a>

        <a class="btn" href="games.html">
          <span class="btn-text">Games</span>
          <img class="btn-icon" src="images/kg.png" alt="" />
        </a>

        <a class="btn" href="songs.html">
          <span class="btn-text">Songs</span>
          <img class="btn-icon" src="images/ss.png" alt="" />
        </a>
      </div>
    </main>

    <footer>
      <div class="credit">Created by Graeme Cattermole</div>
    </footer>
  </body>
</html>
