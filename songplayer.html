<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />

    <!-- iOS Home Screen behaviour -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Adventure Island" />
    <meta name="theme-color" content="#ffcc00" />

    <link rel="apple-touch-icon" href="../images/home0.png" />
    <link rel="manifest" href="manifest.json" />

    <title>Adventure Island Songs</title>

    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }

      :root {
        --sun: #ffd23f;
        --orange-dark: #c45a1a;
        --playing: #3fbf6f;
        --btn-bg: #8b2a00;
        --btn-gold: #e8a020;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        max-width: 100vw;
      }

      body {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        background: radial-gradient(ellipse at center top, #e85a1a, #c03a0a);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        min-height: 100dvh;
        position: relative;
        overflow-y: auto;
      }

      .sun {
        position: absolute;
        top: max(10px, env(safe-area-inset-top, 10px));
        right: clamp(10px, 4vw, 40px);
        width: clamp(40px, 8vw, 72px);
        height: clamp(40px, 8vw, 72px);
        border-radius: 50%;
        background: radial-gradient(circle at 35% 35%, #ffefae, var(--sun) 70%);
        box-shadow: 0 0 24px 8px rgba(255, 210, 63, 0.5);
        pointer-events: none;
        z-index: 0;
      }

      .back-link {
        position: absolute;
        top: max(14px, env(safe-area-inset-top, 14px));
        left: clamp(10px, 4vw, 30px);
        font-weight: bold;
        color: #fae207;
        -webkit-text-stroke: 0.6px #f4930b;
        text-decoration: none;
        font-size: clamp(1rem, 3vw, 1.6rem);
        z-index: 2;
      }

      h1 {
        color: #fae207;
        -webkit-text-stroke: 0.8px #f4930b;
        text-align: center;
        letter-spacing: 0.03em;
        line-height: 1.1;
        font-size: clamp(1.6rem, 6vw, 4rem);
        padding: 0.6em 0.5em 0.3em;
        margin-top: 40px;
        z-index: 1;
        position: relative;
        flex-shrink: 0;
      }

      .grid-wrapper {
        flex: 1 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        padding: 1vh 4vw 6vh;
        position: relative;
        z-index: 1;
      }

      .player {
        display: flex;
        flex-direction: column;
        gap: clamp(14px, 4vh, 36px);
        width: min(92vw, 620px);
      }

      /* Progress bar */
      .seek {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 34px;
        background: transparent;
        cursor: pointer;
        touch-action: none;
      }
      .seek::-webkit-slider-runnable-track {
        height: 18px;
        border-radius: 999px;
        border: 2px solid var(--btn-gold);
        background: linear-gradient(
          to right,
          var(--sun) var(--pct, 0%),
          var(--btn-bg) var(--pct, 0%)
        );
      }
      .seek::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 30px;
        height: 30px;
        margin-top: -8px;
        border-radius: 50%;
        background: var(--btn-gold);
        border: 2px solid var(--btn-bg);
      }
      .seek::-moz-range-track {
        height: 18px;
        border-radius: 999px;
        border: 2px solid var(--btn-gold);
        background: linear-gradient(
          to right,
          var(--sun) var(--pct, 0%),
          var(--btn-bg) var(--pct, 0%)
        );
      }
      .seek::-moz-range-thumb {
        width: 26px;
        height: 26px;
        border-radius: 50%;
        background: var(--btn-gold);
        border: 2px solid var(--btn-bg);
      }

      .times {
        display: flex;
        justify-content: space-between;
        margin-top: -6px;
        font-weight: bold;
        font-size: clamp(1rem, 4vw, 1.5rem);
        color: #fae207;
        -webkit-text-stroke: 0.4px #f4930b;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: clamp(8px, 2.5vw, 20px);
      }

      .btn {
        font-family:
          "Chalkboard SE", "Comic Sans MS", "Segoe Print", sans-serif;
        font-weight: bold;
        color: var(--btn-gold);
        background: var(--btn-bg);
        border: 3px solid var(--btn-gold);
        border-radius: clamp(10px, 2vw, 16px);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: clamp(60px, 18vw, 110px);
        font-size: clamp(1.4rem, 5.5vw, 2.6rem);
        -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.2);
        -webkit-user-select: none;
        user-select: none;
        transition:
          transform 0.1s ease,
          box-shadow 0.1s ease,
          background 0.15s ease,
          border-color 0.15s ease;
      }

      .btn:active {
        transform: translateY(2px) scale(0.97);
        box-shadow: 0 1px 0 var(--orange-dark);
      }

      .btn.playing {
        background: var(--playing);
        border-color: #d8ffe4;
        color: #06371c;
        -webkit-text-stroke: 0.5px rgba(0, 0, 0, 0.15);
      }

      .status {
        min-height: 1.4em;
        text-align: center;
        font-weight: bold;
        font-size: 1.1rem;
        color: #fae207;
      }

      /* Landscape phones */
      @media screen and (orientation: landscape) and (max-height: 450px) {
        h1 {
          font-size: clamp(1.2rem, 4.5vw, 2.4rem);
          margin-top: 0;
          padding-top: 0.3em;
        }
        .player {
          gap: 8px;
        }
        .btn {
          height: clamp(40px, 22vh, 80px);
        }
      }

      /* iPhone portrait, launched from Home Screen */
      @media screen and (orientation: portrait) and (max-width: 430px) and (display-mode: standalone) {
        h1 {
          margin-top: max(60px, env(safe-area-inset-top, 50px)) !important;
        }
      }
    </style>
  </head>

  <body>
    <div class="sun"></div>
    <a class="back-link" href="songs.html">&larr; Back</a>

    <h1 id="title">Song</h1>

    <div class="grid-wrapper">
      <div class="player">
        <div>
          <input
            class="seek"
            id="seek"
            type="range"
            min="0"
            max="0"
            step="0.1"
            value="0"
            aria-label="Song position"
          />
          <div class="times">
            <span id="current">0:00</span>
            <span id="total">0:00</span>
          </div>
        </div>

        <div class="controls">
          <button class="btn" id="play" type="button">Play</button>
          <button class="btn" id="reset" type="button">Reset</button>
        </div>

        <div class="status" id="status" aria-live="polite"></div>
      </div>
    </div>

    <audio id="player" preload="metadata"></audio>

    <script>
      const BASE_URL = "https://adventureislandesl.b-cdn.net/Song";

      const SONGS = [
        "The Rainbow Song",
        "My Classroom",
        "Favorite Fruits",
        "I Like Vegetables",
        "Amazing Animals",
        "Fun Feelings",
        "How's the Weather?",
        "Is That a Butterfly?",
        "Broom, Broom, Broom",
        "Adventure Island",
        "Head And Shoulders",
        "Crazy Clothes",
        "In My Kitchen",
        "I Like Candy",
        "My Family",
        "Actions",
        "The Alphabet Song",
        "I'm a Scary Vampire",
        "Merry Christmas Santa",
        "All Songs",
      ];

      const songNum = Number(new URLSearchParams(location.search).get("song"));
      if (!Number.isInteger(songNum) || songNum < 1 || songNum > SONGS.length) {
        location.replace("songs.html");
      }
      const title = SONGS[songNum - 1] || "";

      const player = document.getElementById("player");
      const seek = document.getElementById("seek");
      const playBtn = document.getElementById("play");
      const resetBtn = document.getElementById("reset");
      const currentEl = document.getElementById("current");
      const totalEl = document.getElementById("total");
      const statusEl = document.getElementById("status");
      let isSeeking = false;

      document.getElementById("title").textContent = title;
      document.title = `${title} – Adventure Island Songs`;

      if (title) player.src = `${BASE_URL}${songNum}.mp3`;

      function fmt(t) {
        if (!isFinite(t)) return "0:00";
        const m = Math.floor(t / 60);
        const s = Math.floor(t % 60);
        return `${m}:${String(s).padStart(2, "0")}`;
      }

      function updateUI() {
        const dur = player.duration;
        if (isFinite(dur) && dur > 0) {
          seek.max = dur;
          totalEl.textContent = fmt(dur);
        }
        if (!isSeeking) seek.value = player.currentTime;
        currentEl.textContent = fmt(player.currentTime);
        const pct = seek.max > 0 ? (seek.value / seek.max) * 100 : 0;
        seek.style.setProperty("--pct", pct + "%");
      }

      function setPlaying(isPlaying) {
        playBtn.textContent = isPlaying ? "Pause" : "Play";
        playBtn.classList.toggle("playing", isPlaying);
      }

      playBtn.addEventListener("click", () => {
        if (player.paused) {
          statusEl.textContent = "";
          player.play().catch(() => {
            statusEl.textContent = "Could not play the song.";
          });
        } else {
          player.pause();
        }
      });

      resetBtn.addEventListener("click", () => {
        player.pause();
        player.currentTime = 0;
        updateUI();
      });

      seek.addEventListener("input", () => {
        isSeeking = true;
        currentEl.textContent = fmt(Number(seek.value));
        const pct = seek.max > 0 ? (seek.value / seek.max) * 100 : 0;
        seek.style.setProperty("--pct", pct + "%");
      });
      seek.addEventListener("change", () => {
        player.currentTime = Number(seek.value);
        isSeeking = false;
        updateUI();
      });

      player.addEventListener("loadedmetadata", updateUI);
      player.addEventListener("durationchange", updateUI);
      player.addEventListener("timeupdate", updateUI);
      player.addEventListener("play", () => setPlaying(true));
      player.addEventListener("pause", () => setPlaying(false));
      player.addEventListener("ended", () => {
        setPlaying(false);
        updateUI();
      });
      player.addEventListener("error", () => {
        statusEl.textContent = "Could not load the song.";
      });
    </script>
  </body>
</html>
